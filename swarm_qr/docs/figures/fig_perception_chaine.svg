.0 L 306.0,498.0 L 1240.0,498.0 L 1240.0,398.0" fill="none" stroke="#B07A22" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fB07A22)" stroke-linejoin="round" stroke-linecap="round"/><rect x="649.0" y="487.0" width="302.0" height="22" rx="4" fill="#FFFFFF" fill-opacity="1.0" stroke="#B07A22" stroke-width="0.9"/><text x="800" y="500.0" font-size="10" fill="#B07A22" text-anchor="middle" font-weight="650">LiDAR and camera cone, written straight into the map</text></svg>
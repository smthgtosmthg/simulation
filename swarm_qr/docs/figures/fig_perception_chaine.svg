ze="16" fill="#16201C" text-anchor="middle" font-weight="650">Inside the perception component</text><text x="710.0" y="54" font-size="11" fill="#5F6B66" text-anchor="middle" font-style="italic">one cycle, one vehicle</text><rect x="40" y="90" width="250" height="160" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#0B7285" stroke-width="1.6"/><rect x="40" y="90" width="250" height="26" rx="8" fill="#0B7285" opacity="0.12"/><rect x="40" y="108" width="250" height="8" fill="#0B7285" opacity="0.12"/><text x="52" y="108" font-size="11.5" fill="#0B7285" text-anchor="start" font-weight="650">Sensors</text><text x="53" y="134" font-size="10.5" fill="#16201C" text-anchor="start">left camera</text><text x="53" y="149" font-size="10.5" fill="#16201C" text-anchor="start">right camera</text><text x="53" y="164" font-size="10.5" fill="#16201C" text-anchor="start">LiDAR revolution</text><text x="53" y="179" font-size="10.5" fill="#16201C" text-anchor="start">camera pose</text><text x="53" y="194" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">paired with the previous instant :</text><text x="53" y="209" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">the renderer is one frame behind</text><rect x="360" y="100" width="290" height="96" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#0B7285" stroke-width="1.6"/><rect x="360" y="100" width="290" height="26" rx="8" fill="#0B7285" opacity="0.12"/><rect x="360" y="118" width="290" height="8" fill="#0B7285" opacity="0.12"/><text x="372" y="118" font-size="11.5" fill="#0B7285" text-anchor="start" font-weight="650">Decoding</text><text x="373" y="144" font-size="10.5" fill="#16201C" text-anchor="start">identifier and four corners</text><text x="373" y="159" font-size="10.5" fill="#16201C" text-anchor="start">both cameras, every cycle</text><rect x="360" y="250" width="290" height="96" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#364FC7" stroke-width="1.6"/><rect x="360" y="250" width="290" height="26" rx="8" fill="#364FC7" opacity="0.12"/><rect x="360" y="268" width="290" height="8" fill="#364FC7" opacity="0.12"/><text x="372" y="268" font-size="11.5" fill="#364FC7" text-anchor="start" font-weight="650">Detection</text><text x="373" y="294" font-size="10.5" fill="#16201C" text-anchor="start">a region and a class</text><text x="373" y="309" font-size="10.5" fill="#16201C" text-anchor="start">one camera per cycle, alternating</text><rect x="730" y="116" width="300" height="214" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#16201C" stroke-width="1.6"/><rect x="730" y="116" width="300" height="26" rx="8" fill="#16201C" opacity="0.12"/><rect x="730" y="134" width="300" height="8" fill="#16201C" opacity="0.12"/><text x="742" y="134" font-size="11.5" fill="#16201C" text-anchor="start" font-weight="650">Placement in 3D</text><text x="743" y="160" font-size="10.5" fill="#16201C" text-anchor="start">pixel  →  world ray</text><text x="743" y="175" font-size="10.5" fill="#16201C" text-anchor="start">range : the LiDAR, or the map past 8 m</text><text x="743" y="190" font-size="10.5" fill="#16201C" text-anchor="start"></text><text x="743" y="205" font-size="10.5" fill="#16201C" text-anchor="start">rejected if :</text><text x="743" y="220" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">the incidence is too large</text><text x="743" y="235" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">the range falls outside the envelope</text><text x="743" y="250" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">the placement is implausible</text><rect x="1110" y="90" width="270" height="300" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#B07A22" stroke-width="1.6"/><rect x="1110" y="90" width="270" height="26" rx="8" fill="#B07A22" opacity="0.12"/><rect x="1110" y="108" width="270" height="8" fill="#B07A22" opacity="0.12"/><text x="1122" y="108" font-size="11.5" fill="#B07A22" text-anchor="start" font-weight="650">Shared map</text><text x="1123" y="134" font-size="10.5" fill="#16201C" text-anchor="start">READ</text><text x="1123" y="149" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">identifier, position, normal</text><text x="1123" y="164" font-size="10.5" fill="#16201C" text-anchor="start"></text><text x="1123" y="179" font-size="10.5" fill="#16201C" text-anchor="start">SPOTTED</text><text x="1123" y="194" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">position, direction of approach</text><text x="1123" y="209" font-size="10.5" fill="#16201C" text-anchor="start"></text><text x="1123" y="224" font-size="10.5" fill="#16201C" text-anchor="start">SEMANTIC</text><text x="1123" y="239" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">a carton is here</text><text x="1123" y="254" font-size="10.5" fill="#16201C" text-anchor="start"></text><text x="1123" y="269" font-size="10.5" fill="#16201C" text-anchor="start">OCCUPANCY</text><text x="1123" y="284" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">free and solid volume</text><text x="1123" y="299" font-size="10.5" fill="#16201C" text-anchor="start"></text><text x="1123" y="314" font-size="10.5" fill="#16201C" text-anchor="start">COVERAGE</text><text x="1123" y="329" font-size="9.8" fill="#5F6B66" text-anchor="start" font-style="italic">observed, and from where</text><path d="M 290.0,148.0 L 352.0,148.0" fill="none" stroke="#0B7285" stroke-width="1.8" marker-end="url(#f0B7285)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 290.0,190.0 L 320.0,190.0 L 320.0,298.0 L 352.0,298.0" fill="none" stroke="#364FC7" stroke-width="1.8" marker-end="url(#f364FC7)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 650.0,148.0 L 690.0,148.0 L 690.0,176.0 L 722.0,176.0" fill="none" stroke="#0B7285" stroke-width="1.8" marker-end="url(#f0B7285)" stroke-linejoin="round" stroke-linecap="round"/><rect x="664.75" y="111.0" wi
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" font-family="Inter, Helvetica, Arial, sans-serif"><defs><marker id="f364FC7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#364FC7"/></marker><marker id="f98A4A0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98A4A0"/></marker><marker id="f16201C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16201C"/></marker><marker id="f5F6B66" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6B66"/></marker><marker id="fB07A22" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B07A22"/></marker><marker id="fC92A2A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C92A2A"/></marker><marker id="fF6F8F7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F6F8F7"/></marker><marker id="f0B7285" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B7285"/></marker><marker id="fC9D3CF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C9D3CF"/></marker><marker id="f2F9E44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F9E44"/></marker></defs><rect width="1040" height="500" fill="#F6F8F7"/><text x="520.0" y="34" font-size="16" fill="#16201C" text-anchor="middle" font-weight="650">Why distance and angle are a single limit</text><text x="520.0" y="54" font-size="11" fill="#5F6B66" text-anchor="middle" font-style="italic">a panel tilted by α fills the same cone as an untilted panel 1 / cos α times further away</text><path d="M 110.0,250.0 L 740.0,161.5" fill="none" stroke="#98A4A0" stroke-width="1.1" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 110.0,250.0 L 740.0,338.5" fill="none" stroke="#98A4A0" stroke-width="1.1" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M 124.0,250.0 L 730.0,250.0" fill="none" stroke="#5F6B66" stroke-width="1.1" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="399.3" y1="290.7" x2="494.0" y2="196.0" stroke="#364FC7" stroke-width="9" stroke-linecap="round"/><line x1="576.7" y1="184.4" x2="576.7" y2="315.6" stroke="#2F9E44" stroke-width="9" stroke-linecap="round"/><line x1="260" y1="228.9" x2="260" y2="271.1" stroke="#16201C" stroke-width="7" stroke-linecap="round"/><text x="260" y="214.91887479464128" font-size="10.5" fill="#16201C" text-anchor="middle" font-weight="650">the image</text><text x="260" y="295.0811252053587" font-size="9.8" fill="#5F6B66" text-anchor="middle" font-style="italic">one extent, two panels</text><circle cx="110" cy="250" r="9" fill="#16201C"/><text x="110" y="280" font-size="10.5" fill="#5F6B66" text-anchor="middle">camera</text><path d="M 110.0,342.0 L 440.0,342.0" fill="none" stroke="#364FC7" stroke-width="1.3" marker-end="url(#f364FC7)" stroke-linejoin="round" stroke-linecap="round"/><text x="275.0" y="336" font-size="13" fill="#364FC7" text-anchor="middle" font-weight="650" font-style="italic">d</text><path d="M 110.0,378.0 L 576.7,378.0" fill="none" stroke="#2F9E44" stroke-width="1.3" marker-end="url(#f2F9E44)" stroke-linejoin="round" stroke-linecap="round"/><text x="343.34523779156063" y="372" font-size="13" fill="#2F9E44" text-anchor="middle" font-weight="650" font-style="italic">d / cos α</text><line x1="440" y1="250" x2="440" y2="342" stroke="#364FC7" stroke-width="1" stroke-dasharray="3 3"/><line x1="577" y1="250" x2="577" y2="378" stroke="#2F9E44" stroke-width="1" stroke-dasharray="3 3"/><path d="M 440 208 A 42 42 0 0 1 470 220" fill="none" stroke="#364FC7" stroke-width="1.5"/><text x="456.0" y="200" font-size="14" fill="#364FC7" text-anchor="start" font-weight="650">α</text><text x="440.0" y="138" font-size="11.5" fill="#364FC7" text-anchor="middle" font-weight="650">tilted, closer</text><text x="636.6904755831213" y="146" font-size="11.5" fill="#2F9E44" text-anchor="middle" font-weight="650">face-on, further away</text><rect x="320" y="412" width="400" height="66" rx="8" fill="#FFFFFF" fill-opacity="1.0" stroke="#16201C" stroke-width="1.6"/><text x="520" y="438" font-size="10.5" fill="#5F6B66" text-anchor="middle">the two impose the same limit, so one quantity carries both :</text><text x="520" y="464" font-size="15" fill="#16201C" text-anchor="middle" font-weight="650">dₐₚₚ  =  d / cos α</text></svg>